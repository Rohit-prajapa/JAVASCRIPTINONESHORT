<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rohit</title>
</head>
<body style="background-color: #212221; color: #ffff;">
<ul class="language">
  <li>Javascript</li>
</ul>
</body>
<script>
  function addlanguage(LangName){
    const li=document.createElement('li')
    li.innerHTML=`${LangName}`
    document.querySelector('.language').appendChild(li)
  }
  addlanguage('python')
  addlanguage('Java')

  function optilanguage(langName){
    const li=document.createElement('li')
    li.appendChild(document.createTextNode(langName))
    document.querySelector('.language').appendChild(li)
  }
  optilanguage('golang')


  // edit
  // const lang=document.querySelector('li:first-child')
  // lang.outerHTML='<li>Typescript</>'


const lang=document.querySelector('li:last-child')
lang.remove()
</script>
</html>
